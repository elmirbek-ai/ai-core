services:
  ai-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-core:local
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - backend

  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    depends_on:
      ai-core:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - backend

networks:
  backend:
    driver: bridge
