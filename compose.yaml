services:
  ai-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-core:local
    env_file:
      - .env
    ports:
      - "${AI_CORE_PORT:-8000}:8000"
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
